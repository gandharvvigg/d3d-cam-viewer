name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk D3DCamViewer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: D3DCamViewer
          path: D3DCamViewer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: D3D Cam Viewer v1.0.${{ github.run_number }}
          body: Tap D3DCamViewer.apk below to download, then open it to install.
          files: D3DCamViewer.apk
          make_latest: true
