name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using permanent release key"
          else
            echo "No release key configured; using debug signing"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk HiCamViewer.apk
          cp app/build/outputs/bundle/release/app-release.aab HiCamViewer-playstore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: HiCamViewer
          path: |
            HiCamViewer.apk
            HiCamViewer-playstore.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: HiCam Viewer v2.2.${{ github.run_number }}
          body: |
            **HiCamViewer.apk** — tap to download and install on your phone.
            **HiCamViewer-playstore.aab** — upload this file to Google Play Console.
          files: |
            HiCamViewer.apk
            HiCamViewer-playstore.aab
          make_latest: true
